<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TH Cosmetics - متجر التجميل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-pink-50 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold text-pink-600">TH Cosmetics 💄</h1>
        <div id="authBtnContainer">
            <button onclick="toggleAdminView()" class="bg-pink-600 text-white px-4 py-2 rounded-lg text-sm font-bold">دخول الأدمن 🔐</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        <!-- رسالة نجاح الطلب -->
        <div id="successAlert" class="hidden bg-green-500 text-white p-4 rounded-xl text-center font-bold mb-6 shadow-lg">
            🎉 تم إرسال طلبك بنجاح! سيتم التواصل معك قريباً لتأكيد الشحن.
        </div>

        <!-- واجهة المتجر للعملاء -->
        <div id="customerStoreView">
            <h2 class="text-2xl font-bold text-gray-700 mb-4">منتجات التجميل والعناية</h2>
            
            <!-- قائمة المنتجات -->
            <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8"></div>

            <!-- سلة المشتريات -->
            <div class="bg-white p-6 rounded-xl shadow-lg border border-pink-100">
                <h3 class="text-xl font-bold mb-4 text-gray-800 flex justify-between items-center">
                    <span>سلة المشتريات 🛒</span>
                    <span id="cartCountBadge" class="bg-pink-100 text-pink-600 text-sm px-3 py-1 rounded-full">0 منتجات</span>
                </h3>
                
                <div id="cartItemsList" class="divide-y mb-4">
                    <p class="text-gray-400 py-2">السلة فارغة حالياً. قم بإضافة منتجات من الأعلى.</p>
                </div>

                <div id="checkoutForm" class="space-y-3 border-t pt-4 hidden">
                    <h4 class="font-bold text-gray-700">بيانات الشحن لإتمام الطلب:</h4>
                    <input type="text" id="custName" placeholder="الاسم بالكامل" class="w-full p-3 border rounded-lg focus:outline-pink-500">
                    <input type="tel" id="custPhone" placeholder="رقم الهاتف" class="w-full p-3 border rounded-lg focus:outline-pink-500">
                    <input type="text" id="custAddress" placeholder="العنوان بالتفصيل" class="w-full p-3 border rounded-lg focus:outline-pink-500">
                    <button type="button" onclick="submitOrder()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-green-700 transition shadow-md">تأكيد إرسال الطلب ✓</button>
                </div>
            </div>
        </div>

        <!-- واجهة الأدمن -->
        <div id="adminDashboardView" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">لوحة تحكم الأدمن 📋 (الطلبات محفوظة دائماً)</h2>
            </div>
            <div id="adminOrdersList" class="space-y-4"></div>
        </div>
    </main>

    <script>
        const defaultProducts = [
            { id: 1, name: 'سيروم أنوا بيتش (Anua Peach 70)', price: 450, category: 'العناية بالبشرة', image: 'https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=300&q=80' },
            { id: 2, name: 'كولاجين البرتقال الطبيعي', price: 350, category: 'العناية بالشعر', image: 'https://images.unsplash.com/photo-1608248597359-9945c57b7852?auto=format&fit=crop&w=300&q=80' }
        ];

        let cart = [];
        let isAdminLoggedIn = false;

        window.onload = function() {
            renderProducts();
            renderCart();
        };

        function renderProducts() {
            const container = document.getElementById('productsGrid');
            container.innerHTML = defaultProducts.map(p => `
                <div class="bg-white p-4 rounded-xl shadow flex gap-4 items-center border border-gray-100">
                    <img src="${p.image}" alt="${p.name}" class="w-20 h-20 object-cover rounded-lg">
                    <div class="flex-1">
                        <span class="text-xs bg-pink-100 text-pink-600 px-2 py-1 rounded font-bold">${p.category}</span>
                        <h3 class="font-bold text-gray-800 mt-1">${p.name}</h3>
                        <p class="text-pink-600 font-bold mt-1">${p.price} ج.م</p>
                        <button onclick="addToCart(${p.id})" class="mt-2 bg-pink-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-pink-700 transition">إضافة للسلة +</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = defaultProducts.find(p => p.id === productId);
            if (product) {
                cart.push(product);
                renderCart();
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cartItemsList');
            const form = document.getElementById('checkoutForm');
            const badge = document.getElementById('cartCountBadge');
            
            badge.innerText = `${cart.length} منتجات`;

            if (cart.length === 0) {
                list.innerHTML = `<p class="text-gray-400 py-2">السلة فارغة حالياً. قم بإضافة منتجات من الأعلى.</p>`;
                form.classList.add('hidden');
                return;
            }

            let total = 0;
            list.innerHTML = cart.map((item, i) => {
                total += item.price;
                return `
                    <div class="py-2 flex justify-between items-center">
                        <span class="font-semibold text-gray-700">${item.name} - <strong class="text-pink-600">${item.price} ج.م</strong></span>
                        <button onclick="removeFromCart(${i})" class="text-red-500 text-xs font-bold hover:underline">حذف</button>
                    </div>
                `;
            }).join('') + `
                <div class="py-3 font-bold text-lg text-gray-800 flex justify-between border-t mt-2">
                    <span>الإجمالي:</span>
                    <span class="text-green-600">${total} ج.م</span>
                </div>
            `;

            form.classList.remove('hidden');
        }

        function submitOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();

            if (!name || !phone || !address) {
                alert('الرجاء كتابة الاسم ورقم الهاتف والعنوان كاملاً!');
                return;
            }

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const newOrder = {
                id: Date.now(),
                date: new Date().toLocaleString('ar-EG'),
                name: name,
                phone: phone,
                address: address,
                items: [...cart],
                total: total
            };

            let existingOrders = JSON.parse(localStorage.getItem('th_orders') || '[]');
            existingOrders.unshift(newOrder);
            localStorage.setItem('th_orders', JSON.stringify(existingOrders));

            cart = [];
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('custAddress').value = '';
            renderCart();

            const alertBox = document.getElementById('successAlert');
            alertBox.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => alertBox.classList.add('hidden'), 5000);
        }

        function toggleAdminView() {
            const btnContainer = document.getElementById('authBtnContainer');
            const storeView = document.getElementById('customerStoreView');
            const adminView = document.getElementById('adminDashboardView');

            if (!isAdminLoggedIn) {
                const pass = prompt('أدخل كلمة سر الأدمن:');
                if (pass === 'admin123') {
                    isAdminLoggedIn = true;
                    btnContainer.innerHTML = `<button onclick="toggleAdminView()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-bold">خروج من الأدمن 🚪</button>`;
                    storeView.classList.add('hidden');
                    adminView.classList.remove('hidden');
                    renderAdminOrders();
                } else if (pass !== null) {
                    alert('كلمة السر خاطئة!');
                }
            } else {
                isAdminLoggedIn = false;
                btnContainer.innerHTML = `<button onclick="toggleAdminView()" class="bg-pink-600 text-white px-4 py-2 rounded-lg text-sm font-bold">دخول الأدمن 🔐</button>`;
                storeView.classList.remove('hidden');
                adminView.classList.add('hidden');
            }
        }

        function renderAdminOrders() {
            const container = document.getElementById('adminOrdersList');
            const orders = JSON.parse(localStorage.getItem('th_orders') || '[]');

            if (orders.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center text-gray-400">لا توجد طلبات واردة حتى الآن.</div>`;
                return;
            }

            container.innerHTML = orders.map(o => `
                <div class="bg-white p-5 rounded-xl shadow border-r-4 border-pink-500">
                    <div class="flex justify-between font-bold text-pink-600 mb-2">
                        <span>طلب رقم: #${o.id.toString().slice(-4)}</span>
                        <span class="text-xs text-gray-400">${o.date}</span>
                    </div>
                    <div class="text-sm space-y-1">
                        <p><strong>الاسم:</strong> ${o.name}</p>
                        <p><strong>الهاتف:</strong> ${o.phone}</p>
                        <p><strong>العنوان:</strong> ${o.address}</p>
                    </div>
                    <div class="mt-3 bg-pink-50 p-3 rounded-lg">
                        <strong class="text-xs text-pink-700">المنتجات المطلوبة:</strong>
                        <ul class="list-disc list-inside text-sm mt-1">
                            ${o.items.map(it => `<li>${it.name} - <strong>${it.price} ج.م</strong></li>`).join('')}
                        </ul>
                    </div>
                    <div class="mt-3 font-bold text-green-600 text-right">
                        الإجمالي: ${o.total} ج.م
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
