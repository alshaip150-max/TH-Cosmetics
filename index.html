<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TH Cosmetics - متجر التجميل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-pink-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [orders, setOrders] = React.useState([]);
            const [products, setProducts] = React.useState([
                { id: 1, name: 'سيروم أنوا بيتش (Anua Peach 70)', price: 450, category: 'العناية بالبشرة', image: 'https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=300&q=80' },
                { id: 2, name: 'كولاجين البرتقال الطبيعي', price: 350, category: 'العناية بالشعر', image: 'https://images.unsplash.com/photo-1608248597359-9945c57b7852?auto=format&fit=crop&w=300&q=80' }
            ]);
            const [cart, setCart] = React.useState([]);
            const [customerName, setCustomerName] = React.useState('');
            const [customerPhone, setCustomerPhone] = React.useState('');
            const [customerAddress, setCustomerAddress] = React.useState('');
            const [orderSuccess, setOrderSuccess] = React.useState(false);

            // استرجاع الطلبات المخزنة عند فتح الموقع
            React.useEffect(() => {
                const saved = localStorage.getItem('th_orders');
                if (saved) {
                    try {
                        setOrders(JSON.parse(saved));
                    } catch(e) {}
                }
            }, []);

            const addToCart = (product) => {
                setCart([...cart, product]);
            };

            const removeFromCart = (index) => {
                const newCart = [...cart];
                newCart.splice(index, 1);
                setCart(newCart);
            };

            const handleCheckout = () => {
                if (!customerName || !customerPhone || !customerAddress) {
                    alert('الرجاء إدخال الاسم ورقم الهاتف والعنوان كاملة!');
                    return;
                }

                if (cart.length === 0) {
                    alert('السلة فارغة!');
                    return;
                }

                const newOrder = {
                    id: Date.now(),
                    date: new Date().toLocaleString('ar-EG'),
                    name: customerName,
                    phone: customerPhone,
                    address: customerAddress,
                    items: [...cart],
                    total: cart.reduce((sum, item) => sum + item.price, 0)
                };

                const updatedOrders = [newOrder, ...orders];
                setOrders(updatedOrders);
                localStorage.setItem('th_orders', JSON.stringify(updatedOrders));

                // إعادة ضبط الحقول
                setCart([]);
                setCustomerName('');
                setCustomerPhone('');
                setCustomerAddress('');
                setOrderSuccess(true);
                setTimeout(() => setOrderSuccess(false), 6000);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* شريط العنوان */}
                    <header className="bg-white shadow-md p-4 flex justify-between items-center">
                        <h1 className="text-xl font-bold text-pink-600">TH Cosmetics 💄</h1>
                        <div>
                            {isAdmin ? (
                                <button onClick={() => setIsAdmin(false)} className="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-bold">خروج من لوحة الأدمن</button>
                            ) : (
                                <button onClick={() => {
                                    const p = prompt('أدخل كلمة سر الأدمن:');
                                    if(p === 'admin123') setIsAdmin(true);
                                    else if(p !== null) alert('كلمة السر خطأ');
                                }} className="bg-pink-600 text-white px-4 py-2 rounded-lg text-sm font-bold">دخول الأدمن 🔐</button>
                            )}
                        </div>
                    </header>

                    {/* المحتوى */}
                    <main className="flex-1 p-4 max-w-5xl mx-auto w-full">
                        {isAdmin ? (
                            <div>
                                <h2 className="text-2xl font-bold mb-4 text-gray-700">لوحة تحكم الأدمن - الطلبات الواردة ({orders.length})</h2>
                                {orders.length === 0 ? (
                                    <p className="text-gray-500 bg-white p-6 rounded-xl shadow">لا توجد طلبات حتى الآن.</p>
                                ) : (
                                    <div className="space-y-4">
                                        {orders.map(o => (
                                            <div key={o.id} className="bg-white p-4 rounded-xl shadow border-r-4 border-pink-500">
                                                <div className="flex justify-between font-bold text-pink-600 mb-2">
                                                    <span>طلب رقم: #{o.id.toString().slice(-4)}</span>
                                                    <span>{o.date}</span>
                                                </div>
                                                <p><strong>الاسم:</strong> {o.name}</p>
                                                <p><strong>الهاتف:</strong> {o.phone}</p>
                                                <p><strong>العنوان:</strong> {o.address}</p>
                                                <div className="mt-2 bg-gray-50 p-2 rounded">
                                                    <strong>المنتجات:</strong>
                                                    <ul className="list-disc list-inside text-sm">
                                                        {o.items.map((it, i) => (
                                                            <li key={i}>{it.name} - {it.price} ج.م</li>
                                                        ))}
                                                    </ul>
                                                </div>
                                                <p className="mt-2 font-bold text-green-600">الإجمالي: {o.total} ج.م</p>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div>
                                {orderSuccess && (
                                    <div className="bg-green-100 border border-green-400 text-green-700 p-4 rounded mb-4 text-center font-bold">
                                        🎉 تم إرسال طلبك بنجاح! سيتم التواصل معك قريباً لتأكيد الشحن.
                                    </div>
                                )}

                                <h2 className="text-2xl font-bold mb-4 text-gray-700">منتجات التجميل والعناية</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                                    {products.map(prod => (
                                        <div key={prod.id} className="bg-white p-4 rounded-xl shadow flex gap-4 items-center">
                                            <img src={prod.image} alt={prod.name} className="w-20 h-20 object-cover rounded-lg" />
                                            <div className="flex-1">
                                                <span className="text-xs bg-pink-100 text-pink-600 px-2 py-1 rounded">{prod.category}</span>
                                                <h3 className="font-bold mt-1">{prod.name}</h3>
                                                <p className="text-pink-600 font-bold">{prod.price} ج.م</p>
                                                <button onClick={() => addToCart(prod)} className="mt-2 bg-pink-600 text-white px-3 py-1 rounded text-sm font-bold">إضافة للسلة</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* سلة الشراء */}
                                <div className="bg-white p-6 rounded-xl shadow">
                                    <h3 className="text-xl font-bold mb-4">سلة المشتريات ({cart.length})</h3>
                                    {cart.length === 0 ? (
                                        <p className="text-gray-500">السلة فارغة، قم بإضافة منتجات.</p>
                                    ) : (
                                        <div>
                                            <ul className="divide-y mb-4">
                                                {cart.map((item, index) => (
                                                    <li key={index} className="py-2 flex justify-between items-center">
                                                        <span>{item.name} - <strong>{item.price} ج.م</strong></span>
                                                        <button onClick={() => removeFromCart(index)} className="text-red-500 text-sm">حذف</button>
                                                    </li>
                                                ))}
                                            </ul>

                                            <div className="space-y-3 border-t pt-4">
                                                <h4 className="font-bold text-gray-700">بيانات الشحن لإتمام الطلب:</h4>
                                                <input type="text" placeholder="الاسم بالكامل" value={customerName} onChange={e => setCustomerName(e.target.value)} className="w-full p-2 border rounded" />
                                                <input type="tel" placeholder="رقم الهاتف" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} className="w-full p-2 border rounded" />
                                                <input type="text" placeholder="العنوان بالتفصيل" value={customerAddress} onChange={e => setCustomerAddress(e.target.value)} className="w-full p-2 border rounded" />
                                                <button onClick={handleCheckout} className="w-full bg-green-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-green-700 transition">تأكيد إرسال الطلب ✓</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
