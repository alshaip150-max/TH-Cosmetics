<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TH Cosmetics - متجر التجميل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-pink-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [password, setPassword] = React.useState('');
            const [orders, setOrders] = React.useState([]);
            const [products, setProducts] = React.useState([
                { id: 1, name: 'سيروم أنوا بيتش (Anua Peach 70)', price: 450, category: 'العناية بالبشرة', image: 'https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=300&q=80' },
                { id: 2, name: 'كولاجين البرتقال الطبيعي', price: 350, category: 'العناية بالشعر', image: 'https://images.unsplash.com/photo-1608248597359-9945c57b7852?auto=format&fit=crop&w=300&q=80' }
            ]);
            const [cart, setCart] = React.useState([]);
            const [customerInfo, setCustomerInfo] = React.useState({ name: '', phone: '', address: '' });
            const [orderSuccess, setOrderSuccess] = React.useState(false);

            // جلب الطلبات المحفوظة سحابياً أو محلياً لضمان عدم ضياعها
            React.useEffect(() => {
                const savedOrders = localStorage.getItem('th_cosmetics_orders');
                if (savedOrders) {
                    setOrders(JSON.parse(savedOrders));
                }
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === 'admin123') {
                    setIsAdmin(true);
                } else {
                    alert('كلمة المرور غير صحيحة!');
                }
            };

            const addToCart = (product) => {
                setCart([...cart, product]);
            };

            const checkout = (e) => {
                e.preventDefault();
                if (!customerInfo.name || !customerInfo.phone || !customerInfo.address) {
                    alert('الرجاء إدخال جميع بيانات الشحن');
                    return;
                }
                const newOrder = {
                    id: Date.now(),
                    date: new Date().toLocaleString('ar-EG'),
                    customer: customerInfo,
                    items: cart,
                    total: cart.reduce((sum, item) => sum + item.price, 0)
                };

                const updatedOrders = [newOrder, ...orders];
                setOrders(updatedOrders);
                localStorage.setItem('th_cosmetics_orders', JSON.stringify(updatedOrders));
                
                setCart([]);
                setCustomerInfo({ name: '', phone: '', address: '' });
                setOrderSuccess(true);
                setTimeout(() => setOrderSuccess(false), 5000);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* شريط التنقل */}
                    <header className="bg-white shadow-md p-4 flex justify-between items-center">
                        <h1 className="text-xl font-bold text-pink-600">TH Cosmetics 💄</h1>
                        <div>
                            {isAdmin ? (
                                <button onClick={() => setIsAdmin(false)} className="bg-red-500 text-white px-4 py-2 rounded-lg text-sm">خروج من لوحة الأدمن</button>
                            ) : (
                                <button onClick={() => {
                                    const pass = prompt('أدخل كلمة سر الأدمن:');
                                    if(pass === 'admin123') setIsAdmin(true);
                                    else if(pass) alert('كلمة السر خاطئة');
                                }} className="bg-pink-600 text-white px-4 py-2 rounded-lg text-sm">دخول الأدمن 🔐</button>
                            )}
                        </div>
                    </header>

                    {/* المحتوى الرئيسي */}
                    <main className="flex-1 p-4 max-w-6xl mx-auto w-full">
                        {isAdmin ? (
                            <div>
                                <h2 className="text-2xl font-bold mb-4 text-gray-700">لوحة تحكم الأدمن - الطلبات الواردة ({orders.length})</h2>
                                {orders.length === 0 ? (
                                    <p className="text-gray-500 bg-white p-6 rounded-xl shadow">لا توجد طلبات حتى الآن.</p>
                                ) : (
                                    <div className="space-y-4">
                                        {orders.map(order => (
                                            <div key={order.id} className="bg-white p-4 rounded-xl shadow border-r-4 border-pink-500">
                                                <div className="flex justify-between font-bold text-pink-600 mb-2">
                                                    <span>طلب رقم: #{order.id.toString().slice(-4)}</span>
                                                    <span>{order.date}</span>
                                                </div>
                                                <p><strong>الاسم:</strong> {order.customer.name}</p>
                                                <p><strong>الهاتف:</strong> {order.customer.phone}</p>
                                                <p><strong>العنوان:</strong> {order.customer.address}</p>
                                                <div className="mt-2 bg-gray-50 p-2 rounded">
                                                    <strong>المنتجات المطلوبة:</strong>
                                                    <ul className="list-disc list-inside text-sm">
                                                        {order.items.map((item, idx) => (
                                                            <li key={idx}>{item.name} - {item.price} ج.م</li>
                                                        ))}
                                                    </ul>
                                                </div>
                                                <p className="mt-2 font-bold text-green-600">الإجمالي: {order.total} ج.م</p>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div>
                                {orderSuccess && (
                                    <div className="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4 text-center">
                                        تم إرسال طلبك بنجاح! سيتم التواصل معك قريباً لتأكيد الشحن.
                                    </div>
                                )}
                                <h2 className="text-2xl font-bold mb-4 text-gray-700">منتجات العناية والتجميل</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                    {products.map(product => (
                                        <div key={product.id} className="bg-white p-4 rounded-xl shadow flex gap-4 items-center">
                                            <img src={product.image} alt={product.name} className="w-24 h-24 object-cover rounded-lg" />
                                            <div className="flex-1">
                                                <span className="text-xs bg-pink-100 text-pink-600 px-2 py-1 rounded">{product.category}</span>
                                                <h3 className="font-bold text-lg mt-1">{product.name}</h3>
                                                <p className="text-pink-600 font-bold">{product.price} ج.م</p>
                                                <button onClick={() => addToCart(product)} className="mt-2 bg-pink-600 text-white px-3 py-1 rounded text-sm">إضافة للسلة</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* سلة الشراء وإتمام الطلب */}
                                <div className="bg-white p-6 rounded-xl shadow">
                                    <h3 className="text-xl font-bold mb-4">سلة المشتريات ({cart.length})</h3>
                                    {cart.length === 0 ? (
                                        <p className="text-gray-500">السلة فارغة حالياً.</p>
                                    ) : (
                                        <div>
                                            <ul className="divide-y mb-4">
                                                {cart.map((item, index) => (
                                                    <li key={index} className="py-2 flex justify-between">
                                                        <span>{item.name}</span>
                                                        <span className="font-bold">{item.price} ج.م</span>
                                                    </li>
                                                ))}
                                            </ul>
                                            <form onSubmit={checkout} className="space-y-3">
                                                <input type="text" placeholder="الاسم بالكامل" value={customerInfo.name} onChange={e => setCustomerInfo({...customerInfo, name: e.target.value})} className="w-full p-2 border rounded" required />
                                                <input type="tel" placeholder="رقم الهاتف" value={customerInfo.phone} onChange={e => setCustomerInfo({...customerInfo, phone: e.target.value})} className="w-full p-2 border rounded" required />
                                                <input type="text" placeholder="العنوان بالتفصيل" value={customerInfo.address} onChange={e => setCustomerInfo({...customerInfo, address: e.target.value})} className="w-full p-2 border rounded" required />
                                                <button type="submit" className="w-full bg-green-600 text-white py-2 rounded-lg font-bold">تأكيد إرسال الطلب</button>
                                            </form>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
